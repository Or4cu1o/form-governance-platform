services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # T160 (FR-130, SC-021): WAL archiving continuo para PITR — RPO de 15 min
    # exige que nenhum segmento fique represado por mais tempo que isso;
    # archive_timeout forca o flush mesmo sob baixo volume de escrita.
    # Procedimento completo de backup/restauracao em docs/backup-restore.md.
    # DEMO: archive_mode desativado temporariamente — o volume formops_wal_archive
    # e criado root:root e a imagem oficial so ajusta dono de /var/lib/postgresql/data,
    # entao archive_command falhava com "Permission denied" a cada 60s. Reativar
    # com um passo de chown (init container ou entrypoint proprio) antes de um
    # deploy real com PITR.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=off
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - formops_postgres_data:/var/lib/postgresql/data
      - formops_wal_archive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - formops_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - formops_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # T164/demo — env_file repassa o .env inteiro (JWT_SECRET, SEALING_*,
    # EVIDENCE_RESOLVER_HMAC_SECRET, S3_BUCKET_*, CORS_ORIGIN,
    # INITIAL_ADMIN_*, APP_DB_PASSWORD/TABLEAU_RO_DB_PASSWORD — os dois
    # ultimos exigidos pelos passos de provisionamento do
    # docker-entrypoint.sh, nao so pela interpolacao abaixo). O bloco
    # `environment` continua vencendo para as poucas chaves que precisam do
    # valor especifico da rede Docker (nome de host do servico, nao
    # localhost).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql://formops_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # main.ts escuta em API_PORT (7442 no .env, usado pelo fluxo nativo e
      # pelo tunel) — dentro do container isso precisa ser fixo em 3000 para
      # bater com o EXPOSE do Dockerfile e o mapeamento de porta abaixo.
      API_PORT: 3000
    volumes:
      - ./apps/api/keys:/workspace/apps/api/keys:ro
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    # vite.config.ts le o .env da raiz direto do disco (nao via process.env
    # — evita o loadEnv() do Vite, que sobrescreveria NODE_ENV), entao
    # VITE_API_URL/WEB_PORT so chegam ao dev server via este mount.
    volumes:
      - ./.env:/workspace/.env:ro
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    depends_on:
      - api

volumes:
  formops_postgres_data:
  formops_wal_archive:
  formops_minio_data:
  formops_clamav_data:
